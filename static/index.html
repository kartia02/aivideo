<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Video Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "Malgun Gothic", "맑은 고딕", Roboto, "Helvetica Neue", sans-serif;
        word-break: keep-all;
      }
      /* Subtle aurora behind the header */
      .aurora {
        background-image: radial-gradient(
            60rem 30rem at 15% -10%,
            rgba(99, 102, 241, 0.18),
            transparent 60%
          ),
          radial-gradient(
            50rem 25rem at 85% 0%,
            rgba(217, 70, 239, 0.14),
            transparent 60%
          );
      }
      textarea {
        field-sizing: content;
      }
    </style>
  </head>

  <body class="min-h-screen bg-slate-950 text-slate-100 aurora">
    <div class="mx-auto max-w-3xl px-4 py-10 sm:py-14">
      <!-- ── Header ───────────────────────────────────────────────────── -->
      <header class="mb-8">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl">
            AI Video Generator
          </h1>
          <div
            id="health"
            class="rounded-full border border-slate-800 bg-slate-900/60 px-3 py-1 text-xs text-slate-400"
          >
            확인 중…
          </div>
        </div>
        <p class="mt-2 text-sm text-slate-400">
          짧은 아이디어를 시네마틱 프롬프트로 확장한 뒤, 영상으로
          렌더링합니다.
        </p>
      </header>

      <!-- ── Banner (config warnings) ─────────────────────────────────── -->
      <div
        id="banner"
        class="mb-6 hidden rounded-xl border border-amber-500/30 bg-amber-500/10 px-4 py-3 text-sm text-amber-200"
      ></div>

      <!-- ── Step 1: the idea ─────────────────────────────────────────── -->
      <section
        class="rounded-2xl border border-slate-800 bg-slate-900/50 p-5 shadow-xl shadow-black/20 backdrop-blur"
      >
        <label for="prompt" class="block text-sm font-medium text-slate-300">
          아이디어
        </label>
        <textarea
          id="prompt"
          rows="3"
          maxlength="2000"
          placeholder="우주를 나는 고양이"
          class="mt-2 w-full resize-y rounded-xl border border-slate-800 bg-slate-950/70 px-4 py-3 text-slate-100 placeholder-slate-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30"
        ></textarea>

        <div class="mt-4 grid gap-3 sm:grid-cols-3">
          <div>
            <label for="style" class="block text-xs font-medium text-slate-400">
              스타일 <span class="text-slate-600">(선택)</span>
            </label>
            <input
              id="style"
              type="text"
              maxlength="200"
              placeholder="픽사 3D, 느와르…"
              class="mt-1.5 w-full rounded-lg border border-slate-800 bg-slate-950/70 px-3 py-2 text-sm placeholder-slate-600 outline-none focus:border-indigo-500"
            />
          </div>
          <div>
            <label
              for="aspect"
              class="block text-xs font-medium text-slate-400"
            >
              화면비
            </label>
            <select
              id="aspect"
              class="mt-1.5 w-full rounded-lg border border-slate-800 bg-slate-950/70 px-3 py-2 text-sm outline-none focus:border-indigo-500"
            >
              <option value="">모델 기본값</option>
              <option value="16:9">16:9 — 가로</option>
              <option value="9:16">9:16 — 세로</option>
            </select>
          </div>
          <div>
            <label
              for="duration"
              class="block text-xs font-medium text-slate-400"
            >
              길이
            </label>
            <select
              id="duration"
              class="mt-1.5 w-full rounded-lg border border-slate-800 bg-slate-950/70 px-3 py-2 text-sm outline-none focus:border-indigo-500"
            >
              <option value="">모델 기본값</option>
              <option value="4">4초</option>
              <option value="6">6초</option>
              <option value="8">8초</option>
            </select>
          </div>
        </div>

        <div class="mt-5 flex flex-wrap items-center gap-3">
          <button
            id="btn-enhance"
            class="inline-flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-800/80 px-4 py-2.5 text-sm font-medium text-slate-100 transition hover:border-slate-600 hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-40"
          >
            <span class="btn-label">프롬프트 확장</span>
          </button>
          <button
            id="btn-generate"
            class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-950/40 transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-40"
          >
            <span class="btn-label">영상 생성</span>
          </button>
          <label
            class="ml-auto flex cursor-pointer select-none items-center gap-2 text-xs text-slate-400"
          >
            <input
              id="auto-enhance"
              type="checkbox"
              checked
              class="h-4 w-4 rounded border-slate-700 bg-slate-950 text-indigo-500 focus:ring-indigo-500/40"
            />
            생성 전 자동으로 확장
          </label>
        </div>
      </section>

      <!-- ── Step 2: the enhanced prompt ──────────────────────────────── -->
      <section
        id="enhanced-card"
        class="mt-5 hidden rounded-2xl border border-indigo-500/25 bg-indigo-500/5 p-5"
      >
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-sm font-medium text-indigo-200">시네마틱 프롬프트</h2>
          <span id="enhanced-meta" class="text-xs text-slate-500"></span>
        </div>
        <textarea
          id="enhanced"
          rows="5"
          class="mt-2 w-full resize-y rounded-xl border border-slate-800 bg-slate-950/70 px-4 py-3 text-sm leading-relaxed text-slate-200 outline-none transition focus:border-indigo-500"
        ></textarea>
        <p class="mt-2 text-xs text-slate-500">
          자유롭게 수정하세요 — 이 텍스트가 그대로 렌더링에 사용됩니다.
          <button
            id="btn-clear-enhanced"
            class="ml-1 text-indigo-400 underline-offset-2 hover:underline"
          >
            버리고 원본 아이디어로 생성
          </button>
        </p>
      </section>

      <!-- ── Step 3: progress ─────────────────────────────────────────── -->
      <section
        id="progress-card"
        class="mt-5 hidden rounded-2xl border border-slate-800 bg-slate-900/50 p-5"
      >
        <div class="flex items-center gap-3">
          <svg
            id="spinner"
            class="h-5 w-5 animate-spin text-indigo-400"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-90"
              fill="currentColor"
              d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"
            ></path>
          </svg>
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <span id="status-badge" class="rounded-full px-2.5 py-0.5 text-xs font-medium"></span>
              <span id="status-text" class="text-sm text-slate-300"></span>
            </div>
            <p class="mt-1 truncate text-xs text-slate-500">
              <span id="elapsed">0:00</span> 경과 · 작업
              <span id="task-id" class="font-mono"></span>
            </p>
          </div>
        </div>
      </section>

      <!-- ── Step 4: result ───────────────────────────────────────────── -->
      <section
        id="result-card"
        class="mt-5 hidden rounded-2xl border border-emerald-500/25 bg-slate-900/50 p-5"
      >
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <h2 class="text-sm font-medium text-emerald-300">생성된 영상</h2>
          <button
            id="btn-download"
            class="inline-flex items-center gap-2 rounded-lg border border-emerald-500/40 bg-emerald-500/10 px-3.5 py-2 text-sm font-medium text-emerald-200 transition hover:bg-emerald-500/20 disabled:opacity-50"
          >
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M10 3a1 1 0 0 1 1 1v7.586l2.293-2.293a1 1 0 1 1 1.414 1.414l-4 4a1 1 0 0 1-1.414 0l-4-4a1 1 0 1 1 1.414-1.414L9 11.586V4a1 1 0 0 1 1-1z" />
              <path d="M4 15a1 1 0 0 1 1 1h10a1 1 0 1 1 0 2H5a2 2 0 0 1-2-2 1 1 0 0 1 1-1z" />
            </svg>
            <span class="btn-label">MP4 다운로드</span>
          </button>
        </div>
        <video
          id="player"
          controls
          playsinline
          class="w-full rounded-xl border border-slate-800 bg-black"
        ></video>
      </section>

      <!-- ── Errors ───────────────────────────────────────────────────── -->
      <div
        id="error"
        class="mt-5 hidden rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-200"
      ></div>

      <footer class="mt-10 space-y-1 text-center text-xs text-slate-600">
        <p>렌더링에는 1~5분이 걸리며, 영상 길이(초)에 비례해 요금이 청구됩니다.</p>
        <p>프롬프트 입력 후 <kbd class="rounded bg-slate-800 px-1.5 py-0.5 text-slate-400">Ctrl</kbd> + <kbd class="rounded bg-slate-800 px-1.5 py-0.5 text-slate-400">Enter</kbd> 로도 생성할 수 있습니다.</p>
      </footer>
    </div>

    <script>
      "use strict";

      const $ = (id) => document.getElementById(id);
      const el = {
        prompt: $("prompt"),
        style: $("style"),
        aspect: $("aspect"),
        duration: $("duration"),
        autoEnhance: $("auto-enhance"),
        btnEnhance: $("btn-enhance"),
        btnGenerate: $("btn-generate"),
        btnDownload: $("btn-download"),
        btnClearEnhanced: $("btn-clear-enhanced"),
        enhancedCard: $("enhanced-card"),
        enhanced: $("enhanced"),
        enhancedMeta: $("enhanced-meta"),
        progressCard: $("progress-card"),
        spinner: $("spinner"),
        statusBadge: $("status-badge"),
        statusText: $("status-text"),
        elapsed: $("elapsed"),
        taskId: $("task-id"),
        resultCard: $("result-card"),
        player: $("player"),
        error: $("error"),
        health: $("health"),
        banner: $("banner"),
      };

      const POLL_INTERVAL_MS = 3000;
      const POLL_TIMEOUT_MS = 15 * 60 * 1000;

      let busy = false;
      let elapsedTimer = null;
      let currentVideoUrl = null;

      // ── HTTP helper ──────────────────────────────────────────────────
      async function api(path, options = {}) {
        const res = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(
            data.detail
              ? typeof data.detail === "string"
                ? data.detail
                : JSON.stringify(data.detail)
              : `${res.status} ${res.statusText}`
          );
        }
        return data;
      }

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // ── UI helpers ───────────────────────────────────────────────────
      function showError(message) {
        el.error.textContent = message;
        el.error.classList.remove("hidden");
      }

      function clearError() {
        el.error.classList.add("hidden");
        el.error.textContent = "";
      }

      function setBusy(state, activeButton) {
        busy = state;
        for (const btn of [el.btnEnhance, el.btnGenerate]) {
          btn.disabled = state;
          const label = btn.querySelector(".btn-label");
          if (!btn.dataset.idleLabel) btn.dataset.idleLabel = label.textContent;
          label.textContent =
            state && btn === activeButton ? "처리 중…" : btn.dataset.idleLabel;
        }
      }

      // API status -> [badge label, badge classes, explanation]
      const STATUS_STYLES = {
        PENDING: ["대기", "bg-slate-700/60 text-slate-200", "대기 중 — 작업이 접수되기를 기다리고 있습니다."],
        PROCESSING: ["생성 중", "bg-indigo-500/20 text-indigo-200", "영상을 생성하고 있습니다… 잠시만 기다려 주세요."],
        COMPLETED: ["완료", "bg-emerald-500/20 text-emerald-200", "생성이 완료되었습니다."],
        FAILED: ["실패", "bg-rose-500/20 text-rose-200", "생성에 실패했습니다."],
      };

      function setStatus(status) {
        const [label, classes, text] = STATUS_STYLES[status] ?? [
          status,
          "bg-slate-700/60 text-slate-200",
          "",
        ];
        el.statusBadge.className = `rounded-full px-2.5 py-0.5 text-xs font-medium ${classes}`;
        el.statusBadge.textContent = label;
        el.statusText.textContent = text;
        const finished = status === "COMPLETED" || status === "FAILED";
        el.spinner.classList.toggle("hidden", finished);
      }

      function startElapsed() {
        const startedAt = Date.now();
        stopElapsed();
        const tick = () => {
          const s = Math.floor((Date.now() - startedAt) / 1000);
          el.elapsed.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        };
        tick();
        elapsedTimer = setInterval(tick, 1000);
      }

      function stopElapsed() {
        if (elapsedTimer) clearInterval(elapsedTimer);
        elapsedTimer = null;
      }

      /** The text that will actually be rendered. */
      function effectivePrompt() {
        const enhanced = el.enhanced.value.trim();
        if (!el.enhancedCard.classList.contains("hidden") && enhanced) {
          return { prompt: enhanced, alreadyEnhanced: true };
        }
        return { prompt: el.prompt.value.trim(), alreadyEnhanced: false };
      }

      // ── Actions ──────────────────────────────────────────────────────
      async function enhance() {
        const prompt = el.prompt.value.trim();
        if (prompt.length < 3) {
          showError("아이디어를 3자 이상 입력해 주세요.");
          return;
        }
        clearError();
        setBusy(true, el.btnEnhance);
        try {
          const body = { prompt };
          const style = el.style.value.trim();
          if (style) body.style = style;

          const data = await api("/api/enhance-prompt", {
            method: "POST",
            body: JSON.stringify(body),
          });
          el.enhanced.value = data.enhanced_prompt;
          el.enhancedMeta.textContent = `${data.provider} · ${data.model}`;
          el.enhancedCard.classList.remove("hidden");
        } catch (err) {
          showError(`프롬프트 확장에 실패했습니다 — ${err.message}`);
        } finally {
          setBusy(false);
        }
      }

      async function generate() {
        const { prompt, alreadyEnhanced } = effectivePrompt();
        if (prompt.length < 3) {
          showError("아이디어를 3자 이상 입력해 주세요.");
          return;
        }
        clearError();
        setBusy(true, el.btnGenerate);
        el.resultCard.classList.add("hidden");
        el.player.removeAttribute("src");
        currentVideoUrl = null;

        try {
          const body = { prompt, enhance: !alreadyEnhanced && el.autoEnhance.checked };
          if (el.aspect.value) body.aspect_ratio = el.aspect.value;
          if (el.duration.value) body.duration_seconds = Number(el.duration.value);

          const task = await api("/api/generate-video", {
            method: "POST",
            body: JSON.stringify(body),
          });

          el.taskId.textContent = task.task_id;
          el.progressCard.classList.remove("hidden");
          setStatus(task.status);
          startElapsed();

          // The backend may have enhanced the prompt for us — show what it used.
          if (body.enhance && task.prompt && task.prompt !== prompt) {
            el.enhanced.value = task.prompt;
            el.enhancedMeta.textContent = "자동 확장됨";
            el.enhancedCard.classList.remove("hidden");
          }

          const finished = await pollUntilDone(task.task_id);
          currentVideoUrl = finished.video_url;
          el.player.src = finished.video_url;
          el.resultCard.classList.remove("hidden");
          el.resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } catch (err) {
          setStatus("FAILED");
          showError(err.message);
        } finally {
          stopElapsed();
          setBusy(false);
        }
      }

      async function pollUntilDone(taskId) {
        const startedAt = Date.now();
        while (true) {
          await sleep(POLL_INTERVAL_MS);
          const task = await api(`/api/tasks/${taskId}`);
          setStatus(task.status);

          if (task.status === "COMPLETED") {
            if (!task.video_url) throw new Error("작업은 완료되었지만 영상 URL이 없습니다.");
            return task;
          }
          if (task.status === "FAILED") {
            throw new Error(task.error || "생성 제공자가 실패를 반환했습니다.");
          }
          if (Date.now() - startedAt > POLL_TIMEOUT_MS) {
            throw new Error(
              `15분이 지나도 완료되지 않았습니다. 작업은 계속 진행 중일 수 있으니 /api/tasks/${taskId} 를 확인해 주세요.`
            );
          }
        }
      }

      /**
       * Fetch into a blob so the filename sticks and cross-origin provider URLs
       * (which ignore the `download` attribute) still save properly.
       */
      async function download() {
        if (!currentVideoUrl) return;
        const label = el.btnDownload.querySelector(".btn-label");
        const idle = label.textContent;
        el.btnDownload.disabled = true;
        label.textContent = "준비 중…";
        try {
          const res = await fetch(currentVideoUrl);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          const blob = await res.blob();
          const href = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = href;
          a.download = `ai-video-${el.taskId.textContent.slice(0, 8) || "clip"}.mp4`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(href);
        } catch (err) {
          showError(`다운로드에 실패했습니다 — ${err.message}`);
        } finally {
          label.textContent = idle;
          el.btnDownload.disabled = false;
        }
      }

      // ── Startup: surface config problems before the user spends money ──
      async function checkHealth() {
        try {
          const h = await api("/api/health");
          const model = h.video_model ? ` · ${h.video_model}` : "";
          el.health.textContent = `${h.llm_provider} → ${h.video_provider}${model}`;

          const missing = [];
          if (!h.llm_configured) missing.push(`${h.llm_provider} API 키`);
          if (!h.video_configured) missing.push(`${h.video_provider} API 키`);
          if (missing.length) {
            el.banner.textContent = `.env 에 ${missing.join(", ")}가 설정되지 않았습니다. 설정하기 전까지 요청은 503 오류로 실패합니다.`;
            el.banner.classList.remove("hidden");
          }
        } catch {
          el.health.textContent = "백엔드 연결 안 됨";
          el.banner.textContent =
            "백엔드에 연결할 수 없습니다. uvicorn 이 실행 중인지 확인해 주세요.";
          el.banner.classList.remove("hidden");
        }
      }

      // ── Wiring ───────────────────────────────────────────────────────
      el.btnEnhance.addEventListener("click", enhance);
      el.btnGenerate.addEventListener("click", generate);
      el.btnDownload.addEventListener("click", download);
      el.btnClearEnhanced.addEventListener("click", () => {
        el.enhanced.value = "";
        el.enhancedCard.classList.add("hidden");
      });
      el.prompt.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !busy) generate();
      });

      checkHealth();
    </script>
  </body>
</html>
